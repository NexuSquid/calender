# スプレッドシートから calendar.ics を作って GitHub Pages に公開します。
# ・index.html などを更新したとき
# ・30分ごと（シートの変更を calendar.ics に反映）
# ・Actions タブの「Run workflow」ボタンを押したとき
name: カレンダーを公開

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: スプレッドシートから calendar.ics を作成
        run: node scripts/build-ics.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
