<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カレンダー</title>
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5fa; --card:#ffffff; --ink:#1c2230; --muted:#6c7488; --faint:#b3b8c6;
    --line:#e7e9f0; --hover:#f7f8fc; --accent:#5a5cf0; --accent-ink:#fff;
    --sun:#e5484d; --sat:#3b7cf6; --shadow:0 1px 2px rgba(20,24,40,.04),0 8px 28px rgba(20,24,40,.06);
    --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1117; --card:#171a23; --ink:#e9ebf2; --muted:#9097a8; --faint:#4b5163;
      --line:#262a36; --hover:#1d212c; --accent:#8487ff; --accent-ink:#0f1117;
      --sun:#ff6b70; --sat:#6ea1ff; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  .app{max-width:1200px;margin:0 auto;padding:28px 20px 48px}

  /* ---------- header ---------- */
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
  .brand .title{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 2px}
  .month-label{display:flex;align-items:baseline;gap:6px;margin:0;font-family:Outfit,sans-serif;line-height:1}
  .month-label .m{font-size:52px;font-weight:700;letter-spacing:-.02em}
  .month-label .mu{font-family:"Zen Kaku Gothic New",sans-serif;font-size:20px;font-weight:700}
  .month-label .y{font-size:20px;font-weight:600;color:var(--muted);margin-left:8px}
  .controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn,.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;height:38px;transition:background .15s,border-color .15s,transform .1s}
  .btn{padding:0 14px;font-weight:700;font-size:14px}
  .icon-btn{width:38px;display:grid;place-items:center;font-size:18px}
  .btn:hover,.icon-btn:hover{background:var(--hover)}
  .btn:active,.icon-btn:active{transform:scale(.96)}
  .icon-btn svg{width:18px;height:18px}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;height:38px}
  .seg button{border:0;background:transparent;border-radius:9px;padding:0 14px;font-size:14px;font-weight:700;color:var(--muted)}
  .seg button.active{background:var(--accent);color:var(--accent-ink)}
  .status{font-size:12px;color:var(--muted);margin-top:8px;min-height:1em}
  .status.err{color:var(--sun)}
  .status .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#16a37f;margin-right:6px;vertical-align:1px;box-shadow:0 0 0 0 rgba(22,163,127,.5);animation:live 2s infinite}
  @keyframes live{0%{box-shadow:0 0 0 0 rgba(22,163,127,.5)}70%{box-shadow:0 0 0 7px rgba(22,163,127,0)}100%{box-shadow:0 0 0 0 rgba(22,163,127,0)}}
  .status.flash{animation:flash 1.2s ease-out}
  @keyframes flash{0%{color:var(--accent)}100%{color:var(--muted)}}
  .spin svg{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- legend ---------- */
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .legend:empty{display:none}
  .tag{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;font-weight:500;transition:opacity .15s}
  .tag i{width:10px;height:10px;border-radius:50%;background:var(--c)}
  .tag.off{opacity:.38}
  .tag.off i{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}

  /* ---------- month grid ---------- */
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
  .dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .dow div{padding:12px 10px 10px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;border-bottom:1px solid var(--line)}
  .dow .sun{color:var(--sun)} .dow .sat{color:var(--sat)}
  .cell{min-height:128px;padding:8px 6px 6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;cursor:pointer;transition:background .12s;position:relative;min-width:0}
  .cell:nth-child(7n){border-right:0}
  .grid .cell.lastrow{border-bottom:0}
  .cell:hover{background:var(--hover)}
  .cell.out .num{color:var(--faint)}
  .cell.out .chip{opacity:.5}
  .cell.sel{box-shadow:inset 0 0 0 2px var(--accent)}
  .num{font-family:Outfit,sans-serif;font-weight:600;font-size:14px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%;margin:0 0 2px 2px}
  .cell.sun .num{color:var(--sun)} .cell.sat .num{color:var(--sat)}
  .cell.today .num{background:var(--accent);color:var(--accent-ink)}
  .chip{display:flex;align-items:center;gap:5px;border:0;text-align:left;width:100%;padding:3px 7px;border-radius:7px;font-size:12px;line-height:1.35;font-weight:500;
        background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:inset 3px 0 0 var(--c);white-space:nowrap;overflow:hidden;min-width:0}
  .chip:hover{background:color-mix(in srgb,var(--c) 24%,transparent)}
  .chip .t{font-family:Outfit,sans-serif;font-weight:600;color:color-mix(in srgb,var(--c) 75%,var(--ink));flex:none}
  .chip .n{overflow:hidden;text-overflow:ellipsis}
  .chip.cont{box-shadow:none;border-radius:0 7px 7px 0}
  .chip.cont .n::before{content:"↳ ";opacity:.6}
  /* 画像 */
  .cell-bg{position:absolute;inset:0;z-index:0;pointer-events:none}
  .cell-bg img{width:100%;height:100%;object-fit:cover;display:block}
  .cell-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 45%,rgba(0,0,0,.12))}
  .cell>*:not(.cell-bg){position:relative;z-index:1}
  .cell.has-bg .num{background:rgba(255,255,255,.92);color:#1c2230}
  .cell.has-bg.today .num{background:var(--accent);color:var(--accent-ink)}
  .cell.has-bg .chip{background:color-mix(in srgb,var(--c) 22%,var(--card));}
  .cell.has-bg:hover{background:transparent;filter:brightness(1.04)}
  .thumb-btn{border:0;padding:0;background:none;display:block;width:100%;border-radius:8px;overflow:hidden;flex:none}
  .thumb{display:block;width:100%;height:64px;object-fit:cover;transition:transform .2s}
  .thumb-btn:hover .thumb{transform:scale(1.05)}
  .ev-img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none}
  .panel-img{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:12px;margin-bottom:14px}
  .dlg-img{display:block;width:100%;max-height:300px;object-fit:cover}
  .more{font-size:11.5px;color:var(--muted);font-weight:700;padding:1px 7px;border:0;background:none;text-align:left}
  .more:hover{color:var(--accent)}

  /* ---------- day panel / list ---------- */
  .panel{margin-top:16px;padding:18px 20px}
  .panel h3{margin:0 0 12px;font-size:15px;display:flex;align-items:baseline;gap:8px}
  .panel h3 small{color:var(--muted);font-weight:500;font-size:12px}
  .empty{color:var(--muted);font-size:14px;padding:6px 0}
  .ev{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:11px 10px;border-radius:12px;transition:background .12s}
  .ev:hover{background:var(--hover)}
  .ev .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
  .ev .when{font-family:Outfit,sans-serif;font-weight:600;font-size:13px;color:var(--muted);width:92px;flex:none;padding-top:1px}
  .ev .body{min-width:0;flex:1}
  .ev .name{font-weight:700;font-size:15px}
  .ev .meta{font-size:12.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .badge{display:inline-block;font-size:11px;font-weight:700;color:color-mix(in srgb,var(--c) 75%,var(--ink));background:color-mix(in srgb,var(--c) 15%,transparent);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
  .list{padding:8px 20px 14px}
  .group{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .group:last-child{border-bottom:0}
  .gdate{font-family:Outfit,sans-serif;text-align:center;padding-top:6px}
  .gdate b{display:block;font-size:30px;line-height:1;font-weight:700}
  .gdate span{font-size:12px;color:var(--muted);font-family:"Zen Kaku Gothic New",sans-serif;font-weight:700}
  .gdate.today b{color:var(--accent)}
  .gdate.sun span{color:var(--sun)} .gdate.sat span{color:var(--sat)}

  /* ---------- dialogs ---------- */
  dialog{border:0;padding:0;border-radius:22px;background:var(--card);color:var(--ink);box-shadow:0 24px 80px rgba(0,0,0,.25);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
  dialog::backdrop{background:rgba(15,17,25,.45);backdrop-filter:blur(3px)}
  dialog[open]{animation:pop .18s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .dlg-head{height:8px;background:var(--c,var(--accent))}
  .dlg-body{padding:22px 24px 24px}
  .dlg-x{position:absolute;top:18px;right:16px;border:0;background:var(--hover);width:34px;height:34px;border-radius:50%;font-size:18px;display:grid;place-items:center}
  .dlg-cat{display:inline-block;font-size:12px;font-weight:700;color:color-mix(in srgb,var(--c) 75%,var(--ink));background:color-mix(in srgb,var(--c) 15%,transparent);padding:3px 10px;border-radius:999px;margin-bottom:10px}
  .dlg-title{font-size:22px;font-weight:700;margin:0 40px 14px 0;line-height:1.4}
  .row{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;margin:10px 0;line-height:1.6}
  .row .ic{width:20px;flex:none;color:var(--muted);padding-top:2px}
  .row .ic svg{width:18px;height:18px}
  .desc{white-space:pre-wrap;word-break:break-word}
  .desc a,.row a{color:var(--accent)}
  .linkbtn{display:inline-flex;align-items:center;gap:6px;margin-top:14px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;font-size:14px;padding:10px 16px;border-radius:12px}
  .form label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
  .form input{width:100%;font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  .form input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .hint{font-size:12px;color:var(--muted);line-height:1.7;margin-top:6px}
  .hint code{background:var(--hover);padding:1px 5px;border-radius:5px}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.ghost{margin-right:auto;color:var(--muted)}

  /* ---------- 個人の予定 ---------- */
  .chip.mine{outline:1.5px dashed color-mix(in srgb,var(--c) 70%,transparent);outline-offset:-1.5px}
  .ev.mine .bar{background:repeating-linear-gradient(180deg,var(--c) 0 5px,transparent 5px 8px)}
  .panel h3 .add{margin-left:auto;height:32px;font-size:13px;padding:0 12px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .form textarea{width:100%;font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
  .form textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .swatches{display:flex;gap:8px;flex-wrap:wrap}
  .swatches input{appearance:none;-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--sw);margin:0;cursor:pointer;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
  .swatches input:checked{box-shadow:0 0 0 2px var(--sw)}
  .form-err{color:var(--sun);font-size:13px;font-weight:700;margin-top:10px;min-height:0}
  .mine-note{font-size:12px;color:var(--muted);margin-right:auto;align-self:center}
  .btn.danger{color:var(--sun)}
  .btn.danger.armed{background:var(--sun);color:#fff;border-color:var(--sun)}

  /* ---------- 画像書き出し ---------- */
  dialog.wide{width:min(760px,calc(100vw - 32px))}
  .exp-preview{border:1px solid var(--line);border-radius:14px;background:var(--bg);min-height:220px;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:14px}
  .exp-preview img{display:block;width:100%;height:auto}
  .checks{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
  .form label.check{display:flex;align-items:center;gap:8px;margin:0;font-weight:500;font-size:14px;cursor:pointer}
  .form label.check input{width:18px;height:18px;accent-color:var(--accent)}
  #exportStage{position:fixed;left:-30000px;top:0;pointer-events:none}
  .exp{width:1400px;padding:46px 52px 34px;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
  .exp.light{--bg:#f4f5fa;--card:#fff;--ink:#1c2230;--muted:#6c7488;--faint:#b3b8c6;--line:#e7e9f0;--accent:#5a5cf0;--accent-ink:#fff;--sun:#e5484d;--sat:#3b7cf6}
  .exp.dark{--bg:#0f1117;--card:#171a23;--ink:#e9ebf2;--muted:#9097a8;--faint:#4b5163;--line:#262a36;--accent:#8487ff;--accent-ink:#0f1117;--sun:#ff6b70;--sat:#6ea1ff}
  .exp-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
  .exp-title{font-size:17px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
  .exp-month{display:flex;align-items:baseline;gap:8px;font-family:Outfit,sans-serif;line-height:1}
  .exp-month b{font-size:76px;font-weight:700;letter-spacing:-.02em}
  .exp-month i{font-style:normal;font-family:"Zen Kaku Gothic New",sans-serif;font-size:28px;font-weight:700}
  .exp-month span{font-size:28px;font-weight:600;color:var(--muted);margin-left:10px}
  .exp-legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:640px}
  .exp-legend span{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 11px;font-size:15px;font-weight:500}
  .exp-legend i{width:11px;height:11px;border-radius:50%;background:var(--c)}
  .exp-legend span.mine i{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
  .exp-cal{background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
  .exp-dow,.exp-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .exp-dow div{padding:14px 14px 12px;font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.08em;border-bottom:1px solid var(--line)}
  .exp-dow .sun{color:var(--sun)} .exp-dow .sat{color:var(--sat)}
  .exp-cell{position:relative;min-height:150px;padding:10px 8px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
  .exp-cell:nth-child(7n){border-right:0}
  .exp-cell.last{border-bottom:0}
  .exp-cell>*{position:relative;z-index:1}
  .exp-cell .bgimg{position:absolute;inset:0;z-index:0}
  .exp-cell .bgimg img{width:100%;height:100%;object-fit:cover;display:block}
  .exp-cell .bgimg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 45%,rgba(0,0,0,.12))}
  .exp-num{font-family:Outfit,sans-serif;font-weight:600;font-size:17px;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;margin:0 0 2px 2px}
  .exp-cell.sun .exp-num{color:var(--sun)} .exp-cell.sat .exp-num{color:var(--sat)}
  .exp-cell.out .exp-num{color:var(--faint)}
  .exp-cell.out .exp-chip,.exp-cell.out .exp-thumb{opacity:.45}
  .exp-cell.bg .exp-num{background:rgba(255,255,255,.92);color:#1c2230}
  .exp-chip{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:7px;font-size:13.5px;line-height:1.35;font-weight:500;color:var(--ink);
            background:color-mix(in srgb,var(--c) 15%,var(--card));box-shadow:inset 3px 0 0 var(--c);white-space:nowrap;overflow:hidden}
  .exp-chip .t{font-family:Outfit,sans-serif;font-weight:600;color:color-mix(in srgb,var(--c) 75%,var(--ink));flex:none}
  .exp-chip .n{overflow:hidden;text-overflow:ellipsis}
  .exp-chip.cont{box-shadow:none;border-radius:0 7px 7px 0}
  .exp-chip.cont .n::before{content:"↳ ";opacity:.6}
  .exp-chip.mine{outline:1.5px dashed color-mix(in srgb,var(--c) 70%,transparent);outline-offset:-1.5px}
  .exp-thumb{display:block;width:100%;height:74px;object-fit:cover;border-radius:8px}
  .exp-more{font-size:12.5px;font-weight:700;color:var(--muted);padding:0 8px}
  .exp-foot{display:flex;justify-content:space-between;margin-top:14px;font-size:13px;color:var(--muted)}

  #debugBox{background:#fff8e6;color:#4a3a00;border:1px solid #f5d27a;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.8;word-break:break-all}
  #debugBox code{background:#fff;padding:1px 6px;border-radius:5px;border:1px solid #f0e0b0}
  #debugBox .ng{color:#c62828;font-weight:700}
  #debugBox .mono{font-family:ui-monospace,monospace;font-size:12px}
  .img-err{display:grid;place-items:center;background:#ffe3e3;color:#c62828;font-size:11px;font-weight:700;border-radius:8px;min-height:24px}

  /* ---------- mobile ---------- */
  @media (max-width:720px){
    .controls{width:100%}
    .seg{margin-left:auto}
    .app{padding:18px 12px 40px}
    .month-label .m{font-size:40px}
    .cell{min-height:92px;padding:4px 2px 4px;align-items:stretch;gap:2px}
    .num{font-size:12px;width:22px;height:22px;margin:0 auto 1px}
    .dow div{text-align:center;padding:10px 0 8px}
    .chips{display:flex;flex-direction:column;gap:2px;min-width:0}
    .chip{font-size:10px;line-height:1.25;padding:2px 3px 2px 4px;border-radius:4px;box-shadow:inset 2px 0 0 var(--c);font-weight:700;white-space:normal;
          display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
    .chip .t{display:none}
    .chip.cont{border-radius:0 4px 4px 0}
    .chip.cont .n::before{content:""}
    .more{font-size:10px;padding:0 3px;text-align:center}
    .thumb{height:36px}
    .thumb-btn{border-radius:5px}
    .ev-img{width:48px;height:48px}
    #addBtn{padding:0 12px}
    .two{gap:8px}
    .ev .when{width:70px;font-size:12px}
    .group{grid-template-columns:52px 1fr;gap:6px}
    .list{padding:4px 10px 10px}
  }
  @media (min-width:721px){ .chips{display:flex;flex-direction:column;gap:3px;min-width:0} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <p class="title" id="calTitle">カレンダー</p>
      <h1 class="month-label" id="monthLabel"></h1>
      <div class="status" id="status"></div>
    </div>
    <div class="controls">
      <button class="icon-btn" id="prev" aria-label="前へ">‹</button>
      <button class="btn" id="todayBtn">今日</button>
      <button class="icon-btn" id="next" aria-label="次へ">›</button>
      <div class="seg" role="tablist">
        <button data-view="month" class="active">月</button>
        <button data-view="list">リスト</button>
      </div>
      <button class="btn primary" id="addBtn" title="個人の予定を追加">＋ 予定</button>
      <button class="icon-btn" id="exportBtn" title="画像で保存" aria-label="画像で保存">

<script>
/* =========================================================
   設定：ここにURLを書いておけば、開いた瞬間に読み込みます。
   （URLパラメータ ?sheet=...&tab=...&title=... でも指定できます）
   ========================================================= */
const CONFIG = {
  SHEET_URL:  'https://docs.google.com/spreadsheets/d/1-0YTNoP90UotyKCw8HoVjwyVtm7O9p7OW5eoznuQV-I/edit?usp=sharing',          // 例: 'https://docs.google.com/spreadsheets/d/XXXXXXXX/edit#gid=0'
  SHEET_NAME: '',          // 例: '予定'（空ならURLのgidか先頭のシート）
  TITLE:      'カレンダー',
  WEEK_START: 0,           // 0 = 日曜始まり / 1 = 月曜始まり
  MAX_PER_DAY: 4,          // 1マスに表示する最大件数（超えた分は「+N件」）
  REFRESH_SEC: 30,         // 自動更新の間隔（秒）。シートの変更がこの間隔で画面に反映されます
  SHOW_SETTINGS: false,    // true にすると右上に ⚙（閲覧者が自分でシートを差し替えられる）を表示
};

const PALETTE = ['#5a5cf0','#f0596b','#16a37f','#f59e0b','#0ea5e9','#a855f7','#ec4899','#64748b','#84cc16','#f97316'];
const DOW = ['日','月','火','水','木','金','土'];
const FIELDS = {
  date:      ['日付','開始日','日にち','年月日','date','startdate','start'],
  endDate:   ['終了日','enddate','end'],
  startTime: ['開始時刻','開始時間','時刻','時間','starttime','time'],
  endTime:   ['終了時刻','終了時間','endtime'],
  title:     ['タイトル','予定','予定名','イベント','イベント名','件名','内容','title','event','summary','name'],
  category:  ['カテゴリ','カテゴリー','種類','種別','分類','タグ','category','type','tag'],
  place:     ['場所','会場','location','place','venue'],
  desc:      ['説明','詳細','メモ','備考','description','memo','note','notes','details'],
  url:       ['url','リンク','link'],
  color:     ['色','カラー','color','colour'],
  image:     ['画像','画像url','画像リンク','イメージ','写真','サムネイル','サムネ','image','img','imageurl','picture','photo','thumbnail'],
};

// Googleドライブの共有リンクを表示できる画像URLに変換
function normalizeImg(u){
  u = String(u||'').trim().replace(/^["'「]|["'」]$/g,'');
  if(!u) return '';
  // =IMAGE("https://...") と文字で書かれていた場合は中のURLを取り出す
  const f = u.match(/IMAGE\(\s*"([^"]+)"/i); if(f) u = f[1];
  // Googleドライブの共有リンク各種 → ファイルID
  const m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=|thumbnail\?(?:[^#]*&)?id=)([\w-]{10,})/)
         || u.match(/docs\.google\.com\/uc\?(?:[^#]*&)?id=([\w-]{10,})/);
  if(m) return 'gdrive:' + m[1];
  // GitHub の「blob」ページURL → 画像そのもののURLに変換
  const gh = u.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/);
  if(gh) return `https://raw.githubusercontent.com/${gh[1]}/${gh[2]}/${gh[3]}`;
  // 先頭の / や ./ は取る（GitHub Pages はリポジトリ名の下に置かれるため）
  if(!/^(https?:|data:)/i.test(u)) u = u.replace(/^\.?\//,'');
  return u;
}
// Googleドライブは表示できるURLが環境で違うので、順番に試す
function imgCandidates(src){
  if(src.startsWith('gdrive:')){
    const id = src.slice(7);
    return [`https://lh3.googleusercontent.com/d/${id}=w1200`,
            `https://drive.google.com/thumbnail?id=${id}&sz=w1200`,
            `https://drive.google.com/uc?export=view&id=${id}`];
  }
  return [src];
}
const failedImgs = new Map();   // 元の値 → 理由
function imgFail(el){
  const rest = (el.dataset.alt || '').split('|').filter(Boolean);
  if(rest.length){ el.dataset.alt = rest.slice(1).join('|'); el.src = rest[0]; return; }
  failedImgs.set(el.dataset.orig, true);
  if(DEBUG){ el.outerHTML = `<span class="img-err ${el.className}" title="${esc(el.dataset.orig)}">画像NG</span>`; showDebug(); }
  else el.remove();
}
const imgTag = (src, cls, alt='') => {
  const c = imgCandidates(src);
  return `<img class="${cls}" src="${esc(c[0])}" data-alt="${esc(c.slice(1).join('|'))}" data-orig="${esc(src)}" alt="${esc(alt)}" loading="lazy" referrerpolicy="no-referrer" onerror="imgFail(this)">`;
};

/* ---------- state ---------- */
const store = {
  get(k){ try{ return localStorage.getItem('sscal:'+k) || ''; }catch(e){ return ''; } },
  set(k,v){ try{ v ? localStorage.setItem('sscal:'+k,v) : localStorage.removeItem('sscal:'+k); }catch(e){} },
};
const params = new URLSearchParams(location.search);
// CONFIG にURLが書かれていればそれを最優先（GitHub Pages で公開する時はここに書く）
let source = CONFIG.SHEET_URL ? {
  url:   CONFIG.SHEET_URL,
  sheet: CONFIG.SHEET_NAME,
  title: CONFIG.TITLE,
} : {
  url:   params.get('sheet') || store.get('url')   || '',
  sheet: params.get('tab')   || store.get('sheet') || '',
  title: params.get('title') || store.get('title') || CONFIG.TITLE,
};
const today0 = () => { const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); };
let cursor = new Date(today0().getFullYear(), today0().getMonth(), 1);
let selected = today0();
let view = 'month';
let events = [];          // 表示用（シート＋個人）
let sheetEvents = [];     // スプレッドシートから読んだ予定
const PERSONAL_COLORS = ['#14b8a6','#5a5cf0','#f0596b','#f59e0b','#0ea5e9','#a855f7','#ec4899','#64748b'];
const PERSONAL_LABEL = '個人';
const DEBUG = params.has('debug');
const debugInfo = {};
function showDebug(){
  if(!DEBUG) return;
  let box = document.getElementById('debugBox');
  if(!box){ box = document.createElement('div'); box.id = 'debugBox'; document.querySelector('.app').prepend(box); }
  const imgs = debugInfo.imageValues || [];
  const fails = [...failedImgs.keys()];
  box.innerHTML = `<b>診断モード</b>
    <div>読み込んだ見出し：${(debugInfo.headers||[]).map(h=>`<code>${esc(h)}</code>`).join(' ') || '（なし）'}</div>
    <div>画像：${debugInfo.imageCol ? `<code>${esc(debugInfo.imageCol)}</code> 列を認識（${imgs.length}件）` : imgs.length ? `URL列の画像ファイル ${imgs.length}件を画像として表示` : '<span class="ng">画像が見つかりません。「画像」列か URL列に画像のパス／URLを入れてください</span>'}</div>
    ${debugInfo.imageCol && !imgs.length ? '<div class="ng">画像列が空として読み込まれています。セルに画像を直接貼る／=IMAGE() 関数では読み込めません。URLを文字で入れてください。</div>' : ''}
    ${imgs.slice(0,8).map(v => `<div class="mono">・${esc(v)} → ${esc(imgCandidates(normalizeImg(v))[0])}${failedImgs.has(normalizeImg(v))?' <span class="ng">表示失敗</span>':''}</div>`).join('')}
    ${fails.length ? `<div class="ng">表示できなかった画像：${fails.length}件（URLの間違い・共有設定・ファイル名の大文字小文字を確認）</div>` : ''}`;
}
let byDay = new Map();
let bgByDay = new Map();
let catColors = new Map();
let hidden = new Set();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isMobile = () => matchMedia('(max-width:720px)').matches;
const keyOf = d => `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
const sameDay = (a,b) => a && b && keyOf(a) === keyOf(b);
const addDays = (d,n) => new Date(d.getFullYear(), d.getMonth(), d.getDate()+n);

/* ---------- loading ---------- */
function buildCsvUrl(input, sheetName){
  input = (input||'').trim();
  if(!input) return null;
  if(/output=csv|tqx=out:csv/.test(input)) return input;
  const gid = (input.match(/[#&?]gid=(\d+)/)||[])[1];
  const pub = input.match(/\/spreadsheets\/d\/e\/([\w-]+)/);
  if(pub) return `https://docs.google.com/spreadsheets/d/e/${pub[1]}/pub?output=csv${gid?`&gid=${gid}`:''}`;
  const m = input.match(/\/spreadsheets\/d\/([\w-]+)/);
  const id = m ? m[1] : (/^[\w-]{25,}$/.test(input) ? input : null);
  if(!id) return null;
  let u = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=1`;
  if(sheetName) u += `&sheet=${encodeURIComponent(sheetName)}`;
  else if(gid) u += `&gid=${gid}`;
  return u;
}

function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; }
      else f+=c;
    }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ''));
}

function parseDate(s){
  s = String(s||'').trim().replace(/[（(][^)）]*[)）]/g,'');
  if(!s) return null;
  let m = s.match(/(\d{4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  m = s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);            // 11/9/2026 (US形式)
  if(m) return new Date(+m[3], +m[1]-1, +m[2]);
  m = s.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})/);            // 11/9, 11月9日（年なし→今年）
  if(m) return new Date(new Date().getFullYear(), +m[1]-1, +m[2]);
  return null;
}

function parseTime(s){
  s = String(s||'').trim();
  const m = s.match(/(\d{1,2})[:：時](\d{2})?/);
  if(!m) return '';
  let h = +m[1]; const mi = m[2] || '00';
  if(/(PM|午後)/i.test(s) && h < 12) h += 12;
  if(/(AM|午前)/i.test(s) && h === 12) h = 0;
  return `${h}:${mi}`;
}
const timeVal = t => { if(!t) return -1; const [h,m]=t.split(':'); return +h*60 + +m; };

function rowsToEvents(rows){
  if(!rows.length) return [];
  const norm = s => String(s).toLowerCase().replace(/[\s_\-・]/g,'');
  const head = rows[0].map(norm);
  const idx = {};
  for(const [k,names] of Object.entries(FIELDS)){
    const i = head.findIndex(h => names.map(norm).includes(h));
    if(i >= 0) idx[k] = i;
  }
  let body = rows.slice(1);
  if(idx.date === undefined){            // 見出しが無い場合：A列=日付, B列=タイトル と仮定
    idx.date = 0; idx.title = 1; body = rows;
  }
  if(idx.title === undefined) idx.title = idx.date === 0 ? 1 : 0;
  const get = (r,k) => idx[k] === undefined ? '' : (r[idx[k]] ?? '').trim();
  debugInfo.headers = rows[0];
  debugInfo.found = Object.keys(idx);
  debugInfo.imageCol = idx.image === undefined ? null : rows[0][idx.image];
  debugInfo.imageValues = idx.image === undefined ? [] : body.map(r => (r[idx.image]||'').trim()).filter(Boolean);
  debugInfo.emptyImageRows = 0;

  const out = [];
  for(const r of body){
    const rawDate = get(r,'date');
    const start = parseDate(rawDate);
    const title = get(r,'title');
    let image = normalizeImg(get(r,'image'));
    let link = get(r,'url');
    // URL列に画像ファイル（.png/.jpg など、またはドライブの画像）が入っていたら画像として扱う
    if(!image && link && (/\.(png|jpe?g|gif|webp|avif|svg)(\?.*)?$/i.test(link) || /drive\.google\.com\/(file\/d|open\?id|uc\?)/.test(link))){
      image = normalizeImg(link); (debugInfo.imageValues ||= []).push(link); link = '';
    }
    if(!start || (!title && !image)) continue;
    let end = parseDate(get(r,'endDate')) || start;
    if(end < start) end = start;
    let st = parseTime(get(r,'startTime'));
    if(!st && /\d{1,2}:\d{2}/.test(rawDate.replace(/^\S+/,''))) st = parseTime(rawDate.replace(/^\S+/,''));
    out.push({
      title, start, end,
      startTime: st,
      endTime: parseTime(get(r,'endTime')),
      category: get(r,'category'),
      place: get(r,'place'),
      desc: get(r,'desc'),
      url: link,
      color: get(r,'color'),
      image,
      bg: !title,      // タイトル無し＋画像だけの行 → マス全体の背景画像
    });
  }
  return out;
}

let lastText = null, loading = false, loadedOnce = false;
const hhmmss = d => `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;

// silent=true は自動更新。内容が変わった時だけ再描画するのでチラつきません
async function load(silent){
  if(loading) return;
  loading = true;
  const reloadBtn = $('#reload');
  if(!silent){ reloadBtn.classList.add('spin'); if(!loadedOnce) setStatus('読み込み中…'); }
  let changed = false;
  try{
    const csvUrl = buildCsvUrl(source.url, source.sheet);
    if(!csvUrl){
      if(lastText !== 'DEMO'){ sheetEvents = demoEvents(); lastText = 'DEMO'; changed = true; }
      setStatus('デモ表示中 — index.html の CONFIG.SHEET_URL にスプレッドシートのURLを書いてください');
    }else{
      const res = await fetch(csvUrl + (csvUrl.includes('?') ? '&' : '?') + '_t=' + Date.now(), {cache:'no-store'});
      if(!res.ok) throw new Error(`HTTP ${res.status}`);
      const text = await res.text();
      if(/^\s*<(!doctype|html)/i.test(text)) throw new Error('NOT_PUBLIC');
      if(text !== lastText){ sheetEvents = rowsToEvents(parseCSV(text)); lastText = text; changed = true; }
      setStatus(`<span class="live"></span>${sheetEvents.filter(e=>!e.bg).length}件の予定 · ${hhmmss(new Date())} 確認${CONFIG.REFRESH_SEC>0?` · ${CONFIG.REFRESH_SEC}秒ごとに自動更新`:''}`, false, true);
      if(changed && loadedOnce) flash();
    }
  }catch(e){
    console.error(e);
    const msg = e.message === 'NOT_PUBLIC' || e instanceof TypeError
      ? '読み込めませんでした。共有設定が「リンクを知っている全員」になっているか確認してください'
      : `読み込みに失敗しました（${e.message}）`;
    // 自動更新中の一時的な失敗では、表示中の予定は消さない
    setStatus(msg + (loadedOnce ? '（再試行します）' : ''), true);
  }finally{
    reloadBtn.classList.remove('spin');
    loading = false;
    if(changed || !loadedOnce) rebuild();
    showDebug();
    loadedOnce = true;
  }
}

function setStatus(t, err, html){ const s=$('#status'); s[html?'innerHTML':'textContent']=t; s.classList.toggle('err', !!err); }
function flash(){ const s=$('#status'); s.classList.remove('flash'); void s.offsetWidth; s.classList.add('flash'); }

/* ---------- indexing ---------- */
const pad2 = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const fromIso = s => { const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };

/* ---------- 個人の予定（ブラウザの localStorage に保存） ---------- */
let personalMem = null;   // localStorage が使えない環境用
function loadPersonal(){
  if(personalMem) return personalMem;
  try{ const v = JSON.parse(localStorage.getItem('sscal:personal') || '[]'); return Array.isArray(v) ? v : []; }
  catch(e){ return []; }
}
function savePersonal(list){
  try{ localStorage.setItem('sscal:personal', JSON.stringify(list)); personalMem = null; }
  catch(e){ personalMem = list; }
}
function personalToEvent(p){
  const start = fromIso(p.date); if(!start) return null;
  let end = fromIso(p.endDate) || start; if(end < start) end = start;
  return { id:p.id, title:p.title, start, end, startTime:p.startTime||'', endTime:p.endTime||'',
           category:PERSONAL_LABEL, place:p.place||'', desc:p.desc||'', url:'', image:'', bg:false,
           color:p.color||PERSONAL_COLORS[0], personal:true };
}
function rebuild(){
  events = [...sheetEvents, ...loadPersonal().map(personalToEvent).filter(Boolean)];
  index(); render();
}

function buildDayMap(list){
  const map = new Map();
  for(const e of list){
    for(let d=e.start, n=0; d<=e.end && n<366; d=addDays(d,1), n++){
      const k = keyOf(d);
      if(!map.has(k)) map.set(k, []);
      map.get(k).push({e, cont: n > 0});
    }
  }
  for(const l of map.values()){
    l.sort((a,b) => (a.cont===b.cont ? 0 : a.cont ? -1 : 1)
      || ((b.e.end - b.e.start) - (a.e.end - a.e.start))
      || (a.e.personal === b.e.personal ? 0 : a.e.personal ? 1 : -1)
      || timeVal(a.e.startTime) - timeVal(b.e.startTime));
  }
  return map;
}

function index(){
  catColors = new Map();
  let p = 0;
  for(const e of events){
    if(e.bg || e.personal) continue;
    const c = e.category || '';
    if(!catColors.has(c)) catColors.set(c, null);
    if(e.color && !catColors.get(c)) catColors.set(c, e.color);
  }
  for(const [c,v] of catColors) if(!v) catColors.set(c, PALETTE[p++ % PALETTE.length]);
  if(events.some(e => e.personal)) catColors.set(PERSONAL_LABEL, PERSONAL_COLORS[0]);
  for(const e of events) e.c = e.color || catColors.get(e.category || '');

  bgByDay = new Map();
  for(const e of events) if(e.bg)
    for(let d=e.start, n=0; d<=e.end && n<366; d=addDays(d,1), n++) bgByDay.set(keyOf(d), e.image);
  byDay = buildDayMap(events.filter(e => !e.bg && !hidden.has(e.category || '')));
}

function renderLegend(){

  ).join('');
}

function renderMonth(){
  const ws = CONFIG.WEEK_START;
  $('#dow').innerHTML = [...Array(7)].map((_,i)=>{
    const d=(i+ws)%7; return `<div class="${d===0?'sun':d===6?'sat':''}">${DOW[d]}</div>`;
  }).join('');

  const y = cursor.getFullYear(), m = cursor.getMonth();
  const offset = (new Date(y,m,1).getDay() - ws + 7) % 7;
  const start = new Date(y, m, 1 - offset);
  const weeks = Math.ceil((offset + new Date(y,m+1,0).getDate()) / 7);
  const t = today0();
  let html = '';
  for(let i=0; i<weeks*7; i++){
    const d = addDays(start, i);
    const k = keyOf(d);
    const items = byDay.get(k) || [];
    const cls = ['cell',
      d.getMonth()!==m && 'out', d.getDay()===0 && 'sun', d.getDay()===6 && 'sat',
      sameDay(d,t) && 'today', sameDay(d,selected) && 'sel', i >= (weeks-1)*7 && 'lastrow'
    ].filter(Boolean).join(' ');
    const max = isMobile() ? Math.min(CONFIG.MAX_PER_DAY, 3) : CONFIG.MAX_PER_DAY;
    const shown = items.slice(0, items.length > max ? max-1 : max);
    const chips = shown.map(({e,cont}) => {
      const ei = events.indexOf(e);
      const time = !cont && e.startTime ? `<span class="t">${e.startTime}</span>` : '';
      return `<button class="chip ${cont?'cont':''} ${e.personal?'mine':''}" style="--c:${esc(e.c)}" data-ev="${ei}" title="${esc(e.title)}">${time}<span class="n">${esc(e.title)}</span></button>`;
    }).join('');
    const more = items.length > shown.length ? `<button class="more" data-day="${k}">+${items.length-shown.length}件</button>` : '';
    const bg = bgByDay.get(k);
    const imgEv = items.find(({e}) => e.image);
    const thumb = imgEv ? `<button class="thumb-btn" data-ev="${events.indexOf(imgEv.e)}">${imgTag(imgEv.e.image,'thumb',imgEv.e.title)}</button>` : '';
    const bgHtml = bg ? `<div class="cell-bg">${imgTag(bg,'',`${d.getDate()}日`)}</div>` : '';
    html += `<div class="${cls}${bg?' has-bg':''}" data-day="${k}">${bgHtml}<div class="num">${d.getDate()}</div>${thumb}<div class="chips">${chips}${more}</div></div>`;
  }
  const grid = $('#grid');
  grid.innerHTML = html;
}

function fmtDay(d){ return `${d.getMonth()+1}月${d.getDate()}日(${DOW[d.getDay()]})`; }
function fmtWhen(e){
  const t = e.startTime ? `${e.startTime}${e.endTime?'〜'+e.endTime:''}` : '';
  if(!sameDay(e.start,e.end)) return `${fmtDay(e.start)}${e.startTime?' '+e.startTime:''} 〜 ${fmtDay(e.end)}${e.endTime?' '+e.endTime:''}`;
  return `${e.start.getFullYear()}年${fmtDay(e.start)}${t?'　'+t:'　終日'}`;
}

function evRow(e, cont){
  const ei = events.indexOf(e);
  const when = cont ? '継続' : e.startTime ? `${e.startTime}${e.endTime?'<br>〜'+e.endTime:''}` : '終日';
  const meta = [e.place, e.desc.split('\n')[0]].filter(Boolean).join('　·　');
  return `<button class="ev ${e.personal?'mine':''}" style="--c:${esc(e.c)}" data-ev="${ei}">
    <span class="bar"></span><span class="when">${when}</span>
    <span class="body"><span class="name">${esc(e.title)}</span>${e.category?`<span class="badge">${esc(e.category)}</span>`:''}
    ${meta?`<div class="meta">${esc(meta)}</div>`:''}</span>${e.image?imgTag(e.image,'ev-img'):''}</button>`;
}

function renderDayPanel(){
  const p = $('#dayPanel');
  if(!selected){ p.hidden = true; return; }
  p.hidden = false;
  const items = byDay.get(keyOf(selected)) || [];
  const bg = bgByDay.get(keyOf(selected));
  p.innerHTML = (bg ? imgTag(bg,'panel-img') : '') + `<h3>${fmtDay(selected)}<small>${items.length ? items.length+'件' : ''}</small><button class="btn add" data-add="${iso(selected)}">＋ この日に追加</button></h3>` +
    (items.length ? items.map(({e,cont}) => evRow(e,cont)).join('') : `<div class="empty">予定はありません</div>`);
}

function renderList(){
  const y = cursor.getFullYear(), m = cursor.getMonth();
  const days = new Date(y,m+1,0).getDate();
  const t = today0();
  let html = '';
  for(let i=1;i<=days;i++){
    const d = new Date(y,m,i);
    const items = byDay.get(keyOf(d));
    if(!items) continue;
    const cls = ['gdate', sameDay(d,t)&&'today', d.getDay()===0&&'sun', d.getDay()===6&&'sat'].filter(Boolean).join(' ');
    html += `<div class="group"><div class="${cls}"><b>${i}</b><span>${DOW[d.getDay()]}</span></div><div>${items.map(({e,cont})=>evRow(e,cont)).join('')}</div></div>`;
  }
  $('#list').innerHTML = html || `<div class="empty" style="padding:24px 4px">この月の予定はありません</div>`;
}

document.addEventListener('click', ev => {

  if(evBtn && (!isMobile() || evBtn.classList.contains('ev'))){
    openEvent(+evBtn.dataset.ev); return;
  }
  const add = t.closest('[data-add]');

  const edit = t.closest('[data-edit]');
  if(edit){ const p = loadPersonal().find(x => x.id === edit.dataset.edit); $('#eventDlg').close(); if(p) openPersonalForm(p); return; }
  const del = t.closest('[data-del]');
  if(del){
    if(!del.classList.contains('armed')){ del.classList.add('armed'); del.textContent = 'もう一度押すと削除'; return; }
    savePersonal(loadPersonal().filter(x => x.id !== del.dataset.del));
    $('#eventDlg').close(); rebuild(); return;
  }
  const close = t.closest('[data-close]');
  if(close){ close.closest('dialog').close(); return; }
  if(t.tagName === 'DIALOG'){ t.close(); return; }       // 背景クリックで閉じる
  const tag = t.closest('[data-cat]');
  if(tag){ const c = tag.dataset.cat; hidden.has(c) ? hidden.delete(c) : hidden.add(c); index(); render(); return; }
  const day = t.closest('[data-day]');
  if(day){
    const [y,m,d] = day.dataset.day.split('-').map(Number);
    selected = new Date(y,m-1,d);
    if(selected.getMonth() !== cursor.getMonth() || selected.getFullYear() !== cursor.getFullYear())
      cursor = new Date(y, m-1, 1);
    render();
    if(matchMedia('(max-width:720px)').matches) $('#dayPanel').scrollIntoView({behavior:'smooth', block:'nearest'});
  }
});

/* ---------- 画像で書き出し ---------- */
const H2I_SRC = 'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js';
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
let h2iPromise = null, fontCache = new Map(), expBlob = null, expUrl = null, expToken = 0;

function loadH2I(){
  if(window.htmlToImage) return Promise.resolve();
  return h2iPromise ||= new Promise((ok, ng) => {
    const sc = document.createElement('script');
    sc.src = H2I_SRC; sc.onload = ok; sc.onerror = () => { h2iPromise = null; ng(new Error('ライブラリを読み込めませんでした')); };
    document.head.appendChild(sc);
  });
}
const blobToDataUrl = b => new Promise(ok => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.readAsDataURL(b); });

// 画像に使われている文字だけを含むフォントを Google Fonts から取得して埋め込む（軽量・高速）
async function fontCss(text){
  const chars = [...new Set(text + '0123456789年月日火水木金土+件↳…:〜・')].join('');
  if(fontCache.has(chars)) return fontCache.get(chars);
  const url = 'https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=block&text=' + encodeURIComponent(chars);
  let css = await (await fetch(url)).text();
  const urls = [...new Set(css.match(/https:\/\/fonts\.gstatic\.com\/[^)'"]+/g) || [])];
  const data = await Promise.all(urls.map(async u => blobToDataUrl(await (await fetch(u)).blob())));
  urls.forEach((u,i) => { css = css.split(u).join(data[i]); });
  fontCache.set(chars, css);
  return css;
}

function buildExportHtml(withPersonal, dark){

  const map = buildDayMap(list);
  const offset = (new Date(y,m,1).getDay() - ws + 7) % 7;
  const start = new Date(y, m, 1 - offset);
  const weeks = Math.ceil((offset + new Date(y,m+1,0).getDate()) / 7);
  const MAX = 5;
  let cells = '';
  for(let i=0;i<weeks*7;i++){
    const d = addDays(start,i), k = keyOf(d);

    </div>

      <div class="exp-grid">${cells}</div>

  </div>`;
}

  try{
    await loadH2I();
    stage.innerHTML = buildExportHtml($('#expPersonal').checked, $('#expDark').checked);
    const node = stage.firstElementChild;
    // 画像の読み込みを待つ（CORS非対応の画像は空白になります）
    let broken = 0;
    await Promise.all([...node.querySelectorAll('img')].map(img => new Promise(ok => {
      const done = () => ok();
      const fail = () => { broken++; img.src = BLANK; ok(); };
      if(img.complete && img.naturalWidth) return done();
      img.onload = done; img.onerror = fail; setTimeout(done, 8000);
    })));
    let fontEmbedCSS = '';
    try{ fontEmbedCSS = await fontCss(node.textContent); }catch(e){ console.warn('font', e); }
    const opts = { pixelRatio: 2, cacheBust: false, imagePlaceholder: BLANK,
                   backgroundColor: getComputedStyle(node).backgroundColor };
    if(fontEmbedCSS) opts.fontEmbedCSS = fontEmbedCSS; else opts.skipFonts = true;
    await window.htmlToImage.toPng(node, opts);           // 1回目はキャッシュ温め（Safari対策）
    const blob = await window.htmlToImage.toBlob(node, opts);
    if(token !== expToken) return;
    expBlob = blob;
    if(expUrl) URL.revokeObjectURL(expUrl);
    expUrl = URL.createObjectURL(blob);
    pv.innerHTML = `<img src="${expUrl}" alt="書き出したカレンダー">`;
    save.disabled = false;
    const file = new File([blob], expName(), {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})) share.hidden = false;
    if(broken) $('#expNote').textContent = `※ 画像${broken}枚は外部サイトの制限で書き出せませんでした。GitHubのリポジトリ内に置いた画像なら書き出せます。`;
  }catch(e){
    console.error(e);
    if(token === expToken) pv.innerHTML = `<span>書き出しに失敗しました（${esc(e.message||e)}）</span>`;
  }finally{
    if(token === expToken) stage.innerHTML = '';
  }
}
const expName = () => `calendar-${cursor.getFullYear()}-${pad2(cursor.getMonth()+1)}.png`;

$('#exportBtn').onclick = () => {
  $('#expDark').checked = matchMedia('(prefers-color-scheme: dark)').matches;
  $('#expPersonal').closest('label').hidden = !events.some(e => e.personal);
  $('#exportDlg').showModal();
  makeExport();
};
$('#expPersonal').onchange = makeExport;
$('#expDark').onchange = makeExport;
$('#expSave').onclick = () => {
  if(!expUrl) return;
  const a = document.createElement('a');
  a.href = expUrl; a.download = expName();
  document.body.appendChild(a); a.click(); a.remove();
};
$('#expShare').onclick = async () => {
  try{ await navigator.share({ files:[new File([expBlob], expName(), {type:'image/png'})], title: source.title }); }
  catch(e){ /* キャンセル */ }
};

  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
